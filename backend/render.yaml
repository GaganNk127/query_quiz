services:
  # Type of service
  - type: web
    name: smartrecruit-api
    env: node
    plan: free
    region: oregon
    
    # Build configuration
    buildCommand: "npm install"
    startCommand: "npm start"
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: UPLOAD_PATH
        value: uploads/resumes
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: BCRYPT_ROUNDS
        value: 12
    
    # Health check
    healthCheckPath: /health
    
    # Auto-deployment
    autoDeploy: true
    
    # Build from git branch
    branch: main
    
    # Instance configuration
    instanceType: free
    
    # Disk configuration
    disk:
      name: smartrecruit-disk
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

# Databases
databases:
  - name: smartrecruit-db
    databaseName: smartrecruit
    user: smartrecruit_user
    plan: free
    region: oregon
    ipAllowList: [] # Allow all IPs for development (restrict in production)

# Environment groups (for different environments)
env:
  - key: CORS_ORIGIN
    value: https://your-frontend-domain.vercel.app
    
# Addons
addons: []

# Custom domains (optional)
domains:
  - domain: api.smartrecruit.ai
    type: primary

# Pre-deploy hook
preDeployCommand: "npm run seed"

# Post-deploy hook
postDeployCommand: "echo 'Deployment completed successfully!'"

# Notification settings
notifications:
  - type: email
    address: admin@smartrecruit.ai
